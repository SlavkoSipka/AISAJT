name: GSC Daily Sync

on:
  schedule:
    - cron: '0 7 * * *'   # Svaki dan u 7:00 UTC (9:00 po srpskom vremenu)
  workflow_dispatch:        # Omogućava ručno pokretanje iz GitHub UI

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Trigger GSC sync
        run: |
          response=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -X POST "https://aisajt.com/api/gsc-auto-sync-all" \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}")

          echo "HTTP status: $response"
          echo "Response:"
          cat /tmp/response.json

          if [ "$response" != "200" ]; then
            echo "Sync failed with status $response"
            exit 1
          fi
